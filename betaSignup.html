<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/style/style.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Méta-description (très importante pour le clic sur Google) -->
        <meta name="description" content="Découvrez Flexarion, studio de développement de jeux vidéo indépendant créateur du jeu Holo-Xarion. Plongez dans notre univers !">

        <!-- Keywords pour la recherche internet -->
        <meta name="keywords" content="Flexarion, Holo-Xarion, studio de jeux vidéo, jeux vidéo indépendant, studio indé français, développement de jeux vidéo, jeu RPG, jeu action stratégie, bêta test jeu vidéo, jeu vidéo PC, gaming indé">

        <!-- Balises Open Graph (pour l'affichage sur Discord, Twitter, etc.) -->
        <meta property="og:title" content="Flexarion - Studio de Jeux Vidéo Indépendant">
        <meta property="og:description" content="Créateurs de Holo-Xarion. Découvrez notre histoire et nos projets.">
        <meta property="og:image" content="assets/images/logo.png">
        <title>Flexarion - Studio de Jeux Vidéo - beta</title>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="about.html">À propos</a></li>
                    <li><a href="holo-xarion.html">Holo-Xarion</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <p>Indiquez votre mail pour rejoindre la beta !</p>
            <h1>Préinscription</h1>
        </header>
        
        <main class="zone-intro">
            <section class="zone-form">
                <form>
                    <div class="form-group">
                        <label for="email">Votre adresse email :</label>
                        <input type="email" id="email" name="email" placeholder="exemple@domaine.fr" class="input" required>
                    </div>
                    <div class="btn-group">
                        <button type="submit" name="action" value="logUser" class="btn btn-primary">Envoyer</button>
                        <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
