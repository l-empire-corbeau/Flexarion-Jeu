<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="canonical" href="https://flexarion-jeu.fr/">

    <!-- SEO & Méta -->
    <meta name="description" content="Contactez l'équipe du studio Flexarion pour toute question, partenariat ou pour rejoindre la bêta de crowMaster.">
    <meta name="keywords" content="Contact Flexarion, recrutement jeu vidéo, rejoindre bêta crowMaster, partenariat jeux vidéo, studio Flexarion contact">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contactez-nous - Flexarion">
    <meta property="og:description" content="Une question, un projet ou envie de rejoindre l'aventure crowMaster ? Écrivez-nous !">
    <meta property="og:image" content="https://l-empire-corbeau.github.io/Flexarion-Jeu/assets/images/logo.png">
    <meta property="og:url" content="https://l-empire-corbeau.github.io/Flexarion-Jeu/contact.html">
    <meta name="twitter:card" content="summary_large_image">

    <title>Contact - Flexarion</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="about.html">À propos</a></li>
                <li><a href="crowMaster.html">crowMaster</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <h1>Contactez Flexarion</h1>
    </header>
        
        <main class="zone-intro">
            <section class="zone-form">
                <form>
                    <div class="form-group">
                        <label for="prenom">Votre prénom :</label>
                        <input type="text" id="prenom" name="prenom" placeholder="Prénom" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="nom">Votre nom :</label>
                        <input type="text" id="nom" name="nom" placeholder="Nom" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Votre adresse email :</label>
                        <input type="email" id="email" name="email" placeholder="exemple@domaine.fr" class="input" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Votre message :</label>
                        <textarea id="message" name="message" placeholder="Votre message..." class="input textarea" rows="5" required></textarea>
                    </div>

                    <div class="btn-group">
                        <button type="submit" name="action" value="logUser" class="btn btn-primary">Envoyer</button>
                        <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
